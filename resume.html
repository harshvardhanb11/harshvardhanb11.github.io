<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Harshvardhan Birla's resume, typeset from his LaTeX source."
    />
    <title>Resume — Harshvardhan Birla</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #17221d;
        background: #f3f1e9;
      }
      body {
        margin: 0;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        flex-wrap: wrap;
        padding: 24px max(24px, calc((100vw - 1100px) / 2));
        background: #fff;
        border-bottom: 1px solid #d9ddd7;
      }
      h1 {
        font-size: clamp(24px, 4vw, 36px);
        margin: 0;
      }
      p {
        font-size: 17px;
        line-height: 1.6;
        margin: 8px 0 0;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
      }
      a {
        color: #24533b;
        font-size: 17px;
        text-underline-offset: 4px;
      }
      a:focus-visible {
        outline: 3px solid #24533b;
        outline-offset: 5px;
      }
      main {
        max-width: 1100px;
        margin: 28px auto;
        padding: 0 20px;
      }
      object {
        display: block;
        width: 100%;
        height: 1100px;
        max-height: calc(100vh - 170px);
        min-height: 500px;
        border: 1px solid #d9ddd7;
        background: #fff;
      }
      object p {
        padding: 24px;
      }
      @media (max-width: 600px) {
        header {
          padding: 24px;
        }
        main {
          padding: 0 12px;
        }
        object {
          min-height: 550px;
          max-height: none;
          height: 78vh;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Harshvardhan Birla</h1>
        <p>Resume</p>
      </div>
      <nav aria-label="Resume links">
        <a href="index.html">Back to portfolio</a
        ><a href="resume/resume.pdf" download="Harshvardhan-Birla-Resume.pdf">Download PDF</a
        ><a href="resume/resume.tex" download="Harshvardhan-Birla-Resume.tex">LaTeX source</a>
      </nav>
    </header>
    <main>
      <object
        data="resume/resume.pdf"
        type="application/pdf"
        aria-label="Harshvardhan Birla's resume PDF"
      >
        <p><a href="resume/resume.pdf">Open the resume PDF</a> to read or download it.</p>
      </object>
    </main>
  </body>
</html>
