<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Harshvardhan Birla</title>
    <style>
      body {
        background: #101815;
        color: #efefe6;
        font:
          16px/1.7 Arial,
          sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 650px;
        padding: 35px;
      }
      span {
        font: 11px monospace;
        letter-spacing: 2px;
        color: #cce58c;
      }
      h1 {
        font-size: clamp(40px, 8vw, 70px);
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: -2px;
      }
      p {
        color: #a6b3a3;
        max-width: 420px;
      }
      a {
        display: inline-block;
        color: #cce58c;
        margin-top: 15px;
        text-underline-offset: 7px;
      }
    </style>
  </head>
  <body>
    <main>
      <span>404 / BOUNDARY CONDITION</span>
      <h1>This path<br />doesn’t lead anywhere.</h1>
      <p>
        The project may have moved, or the address may have a typo. The portfolio is a good place to
        start again.
      </p>
      <a href="/" id="home-link">Back to the portfolio ↗</a>
    </main>
    <script>
      const i = location.pathname.indexOf('/projects/');
      if (i >= 0) document.getElementById('home-link').href = location.pathname.slice(0, i + 1);
    </script>
  </body>
</html>
